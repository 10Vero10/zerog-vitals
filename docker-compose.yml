# Levanta todo: docker compose up --build
# Las variables se leen del .env (copia de .env.example); si falta, usan estos valores por defecto.
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-zerogvitals}
      POSTGRES_USER: ${POSTGRES_USER:-zerog}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-dev}
      DB_URL: ${DB_URL:-jdbc:postgresql://postgres:5432/zerogvitals}
      POSTGRES_USER: ${POSTGRES_USER:-zerog}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:5173,http://localhost:3000}
      DEFAULT_MISSION_PROFILE: ${DEFAULT_MISSION_PROFILE:-MARS_TRANSIT}
      SIMULATION_SPEED: ${SIMULATION_SPEED:-30}
    ports:
      - "8080:8080"

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: ${VITE_API_URL:-http://localhost:8080/api}
    depends_on:
      - backend
    ports:
      - "3000:80"

volumes:
  pgdata:
